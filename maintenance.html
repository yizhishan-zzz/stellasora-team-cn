<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配队站维护中 · 星塔旅人配队一览</title>
  <meta name="robots" content="noindex">
  <script>try{if(localStorage.getItem("ss_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <style>
    :root {
      --bg-a: #f6f8fc; --bg-b: #eaeef7; --card: #ffffff; --text: #1b2233; --muted: #5b6478;
      --line: #e2e7f1; --accent: #4a9eff; --accent-2: #39c5bb; --shadow: rgba(74,158,255,.26);
    }
    html[data-theme="dark"] {
      --bg-a: #060b13; --bg-b: #0c1729; --card: #0f1b2d; --text: #e9eef8; --muted: #93a3bb;
      --line: #1d2b42; --accent: #6fb4ff; --accent-2: #5eead4; --shadow: rgba(111,180,255,.22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: var(--text);
      background: linear-gradient(160deg, var(--bg-b), var(--bg-a));
      font-family: "MiSans", "MiSansLatin", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      transition: background .3s, color .3s;
    }
    .box { width: 100%; max-width: 540px; text-align: center; }

    /* 纯 CSS 图标：转动的维护环（没有任何图片 / 表情） */
    .spin {
      width: 74px; height: 74px; margin: 0 auto 26px; position: relative;
    }
    .spin::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 5px solid var(--line);
    }
    .spin::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 5px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-2);
      animation: spin 1.1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin i {
      position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
      border-radius: 50%; background: var(--accent); opacity: .85;
    }

    h1 { font-size: 25px; margin: 0 0 14px; letter-spacing: 1px; }
    p { font-size: 15px; line-height: 1.95; color: var(--muted); margin: 0 0 8px; }
    .tips {
      margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--card); transition: background .3s, border-color .3s;
    }
    .tips .t { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    a.btn {
      display: inline-block; padding: 11px 24px; border-radius: 10px; text-decoration: none;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
      box-shadow: 0 6px 18px var(--shadow); transition: transform .15s ease, box-shadow .15s ease;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px var(--shadow); }
    html[data-theme="dark"] a.btn { color: #06121f; }
    .foot { margin-top: 30px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"><i></i></div>
    <h1>配队站维护中</h1>
    <p>需要功能优化，预计 1-3 小时维护结束。</p>
    <p>或许可以玩玩离线小游戏消遣一下。</p>
    <div class="tips">
      <div class="t">Chrome 断网小恐龙（网页版，点击直接玩）</div>
      <a class="btn" href="https://chromedino.com/" target="_blank" rel="noopener noreferrer">玩一局离线小恐龙 →</a>
    </div>
    <div class="foot">星塔旅人配队一览 · 维护完成后刷新本页即可</div>
  </div>
</body>
</html>
